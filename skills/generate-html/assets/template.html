<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#003B95',
            action: '#006CE4',
            'action-hover': '#0057b8',
            accent: '#FEBB02',
            constructive: '#008009'
          }
        }
      }
    };
  </script>
  <style>
    /* Inline style is bpages-legal only for what Tailwind can't express. */
    .reveal { opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .4s ease; }
    .reveal.visible { opacity: 1; transform: none; }
  </style>
  {{EXTERNAL}}
</head>
<body class="bg-gray-50 text-gray-700 font-sans antialiased min-h-screen">
  <main class="max-w-5xl mx-auto px-4 py-10">

    <header class="mb-10">
      <div class="text-xs font-semibold uppercase tracking-wide text-action mb-2">{{KIND}}</div>
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-3">{{TITLE}}</h1>
      <p class="text-lg text-gray-700 leading-relaxed max-w-2xl mb-4">{{LEDE}}</p>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-500">
        <span>{{DATE}}</span>
        <span>Scope: {{SCOPE}}</span>
        <span>Sources: {{SOURCES}}</span>
      </div>
    </header>

    <nav class="mb-12 border border-gray-200 rounded-lg bg-white p-4">
      <ul class="space-y-1 text-sm text-action">{{CONTENTS}}</ul>
    </nav>

    {{CONTENT}}

    <footer class="mt-16 pt-6 border-t border-gray-200 text-sm text-gray-500">
      <p>{{CAVEATS}}</p>
      <p class="mt-1">{{DATE}}</p>
    </footer>

  </main>

  <script>
    // Reveal-on-scroll (bpages entrance animation), once per element.
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const d = parseInt(e.target.dataset.delay) || 0;
        setTimeout(() => e.target.classList.add('visible'), d);
        io.unobserve(e.target);
      });
    });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

    // Auto-init the two bpages-safe libraries, if a report loaded them.
    // No-op when the library never loaded (offline, or unused this report).
    if (window.hljs) {
      document.querySelectorAll('pre code[class*="language-"]').forEach((b) => window.hljs.highlightElement(b));
    }
    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
      window.mermaid.run();
    }
    // Charts render from their own per-figure inline scripts in the body.
  </script>
</body>
</html>
