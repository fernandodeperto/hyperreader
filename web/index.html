<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperReader</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!--
    Single-page web UI for HyperReader. Activating a row opens the page's
    raw rendered HTML in a new browser tab via the existing
    GET /api/pages/{slug}/content endpoint, with zero app chrome. The
    empty-state, loading-state, and error regions are wired so every fetch
    outcome has a visible surface.
  -->
  <main id="app">
    <header>
      <h1>HyperReader</h1>
      <label for="search" class="visually-hidden">Search pages</label>
      <input id="search" type="search" placeholder="Search by name or description&hellip;" autocomplete="off" autocapitalize="off" spellcheck="false">
      <!-- Live-update indicator, driven by the EventSource connection in
           app.js. data-state cycles connecting -> live -> reconnecting
           so a dropped SSE connection is visible instead of the table
           silently going stale. Starts "connecting" until the stream's
           open event fires (proving the ": connected" comment's headers
           were flushed). -->
      <span id="live-status" data-state="connecting" role="status" aria-live="polite"></span>
    </header>

    <section id="table-view">
      <!-- Visible until the first fetch resolves; managed by app.js. -->
      <p id="loading-state" class="empty">Loading pages&hellip;</p>
      <p id="empty-state" class="empty" hidden>No pages yet.</p>
      <table id="pages-table" hidden>
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
          </tr>
        </thead>
        <!-- tbody rows are activatable: a click (or Enter/Space on a
             focused row) opens the page's raw rendered HTML in a new
             browser tab via GET /api/pages/{slug}/content. -->
        <tbody></tbody>
      </table>
    </section>

    <!-- Error region surfaced when an /api fetch fails (R002: in-UI error) -->
    <p id="error-message" class="error" hidden></p>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
